# Base44 development environment for Streama (Grails 3 / Groovy + AngularJS).
#
# Runs the application from the cloned working tree with the Grails development
# server (`gradlew bootRun`), so source edits are picked up without rebuilding
# an image. MariaDB is used as the database; the `mysql` Grails environment in
# grails-app/conf/application.yml reads its connection details from MYSQL_* env
# vars, so no application code or config had to be changed for this setup.
#
# `proxy` (nginx) is the host port 3000 entry point that the Base44 preview
# proxy talks to; it forwards to the app and marks the request as https — see
# .base44/nginx.conf for why that is needed. It mirrors the reverse proxy of the
# project's own production setup (docker/docker-compose.yml).
services:
  db:
    image: mariadb:10.11
    restart: on-failure
    environment:
      MARIADB_ROOT_PASSWORD: streama_root
      MARIADB_DATABASE: streama
      MARIADB_USER: streama
      MARIADB_PASSWORD: streama
    volumes:
      - streama-db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  web:
    image: eclipse-temurin:8-jdk
    restart: on-failure
    working_dir: /app
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8080"
    environment:
      MYSQL_HOST: db
      MYSQL_PORT: "3306"
      MYSQL_DB: streama
      MYSQL_USER: streama
      MYSQL_PASSWORD: streama
      GRADLE_USER_HOME: /gradle
    volumes:
      - ./:/app
      - streama-gradle:/gradle
      - streama-upload:/data/streama
    command:
      - sh
      - -ec
      - exec ./gradlew bootRun --no-daemon -Dgrails.env=mysql
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://localhost:8080/login/auth"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 180s
    labels:
      base44.project: Streama
      base44.kind: api

  proxy:
    image: nginx:alpine
    restart: on-failure
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "3000:80"
    volumes:
      - ./.base44/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/login/auth"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s
    labels:
      base44.project: Streama
      base44.kind: web
      base44.port: "3000"

volumes:
  streama-db:
  streama-gradle:
  streama-upload:
