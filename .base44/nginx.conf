# Base44 preview entry point for Streama.
#
# The Base44 preview proxy terminates TLS and then talks plain HTTP to host port
# 3000, which this container serves. Because Tomcat would otherwise see a plain
# HTTP request, Streama builds absolute redirects with the `http` scheme — for
# example `/` redirects to `http://<preview host>/login/auth`. A browser inside
# the (https) preview iframe refuses to follow that downgrade, so the page keeps
# showing the preview's loading screen forever.
#
# Forwarding `X-Forwarded-Proto: https` (plus the matching port) makes the app
# treat the request as secure. The application already supports this: Tomcat
# honours the forwarded headers via `server.use-forward-headers: true` in
# grails-app/conf/application.yml. This is a sandbox-only artefact — the compose
# file it belongs to (docker-compose.base44.yml) is not used in any other
# environment, so the application's own config is untouched.
#
# Proxy settings mirror docker/nginx/nginx.conf (the project's production
# reverse proxy).

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    client_max_body_size 0;      # Streama accepts very large uploads (10 TB in app config)
    proxy_request_buffering off; # stream request bodies straight to the app instead of buffering them

    location / {
        proxy_pass http://web:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # See the header comment: the preview proxy in front of this container is https.
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;

        # WebSocket support (SockJS/STOMP), as in docker/nginx/nginx.conf.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Video playback uses Range requests; do not let the proxy buffer the response away.
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
